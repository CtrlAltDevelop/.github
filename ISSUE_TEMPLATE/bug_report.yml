name: Bug report
description: Something behaves differently than documented
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The fastest fixes come from the smallest
        reproductions — if you can get it down to a few lines, please do.

        **Found a security vulnerability?** Don't file it here. Use the
        repository's Security tab or email me.CtrlAltDev@proton.me.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before filing
      options:
        - label: I searched the existing issues, including closed ones
          required: true
        - label: I'm on the latest published version of this package
          required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: The version resolved in your `pubspec.lock`
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: sdk
    attributes:
      label: Dart / Flutter version
      description: Output of `dart --version` or `flutter --version`
      placeholder: "Dart 3.13.0 · Flutter 3.47.0"
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Platforms affected
      multiple: true
      options:
        - Android
        - iOS
        - Web
        - macOS
        - Windows
        - Linux
        - Pure Dart (server / CLI)
        - Not platform specific
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Include the full error and stack trace if there is one.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >-
        The smallest code that still shows the problem — a failing test is
        ideal. This is automatically formatted as Dart, no backticks needed.
      render: dart
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: >-
        Workarounds you found, when it started, or a guess at the cause.
        Screenshots and screen recordings can be dropped in here.
    validations:
      required: false
